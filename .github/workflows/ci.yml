name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 18 * * *"   # 每晚跑逃生舱演示 + 完整 fuzz 回归（UTC 18:00）

jobs:
  test:
    name: 测试与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # fuzz/ 故意不在根 workspace 里（保持 workspace 干净、避免污染主构建的
      # 依赖解析），但这意味着上面三条命令没有一条会碰到它——如果哪次改动
      # 让某个 fuzz target 编不过（比如改了被 fuzz 的函数签名），必须在这里
      # 就报错，而不是等到有人手动跑 cargo fuzz build 才发现。只 check 不
      # build/run：不需要 nightly 或 cargo-fuzz 本身，实测 stable 工具链
      # 就能 check 通过（libfuzzer-sys 只在真正 fuzz build/run 时才需要
      # cargo-fuzz 注入的 sanitizer coverage RUSTFLAGS，plain check 不需要）。
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked

  msrv:
    name: MSRV 1.85 构建门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      # Cargo.lock 已入库，依赖版本可复现；本作业保证任何一次 cargo update
      # 若把某个依赖推到需要更高 rustc 的版本，会在这里大声失败，
      # 而不是等到用户在 rustc 1.85 的机器上构建时才发现。
      - run: cargo check --workspace --locked --all-targets

  escape-hatch:
    name: 逃生舱恢复演示（I1）
    runs-on: ubuntu-latest
    # I1 是头号承诺，不能只靠事后（cron）发现回归——每次 push/PR 都跑。
    steps:
      - uses: actions/checkout@v4
      - name: 安装 b3sum
        # 用 BLAKE3 官方预编译二进制而非 `cargo install b3sum`：后者要编译，
        # 本机实测约 1-2 分钟；下载预编译二进制实测 <5 秒（本机到 GitHub 的
        # 下载耗时，CI runner 到 github.com 的下载通常更快，同为 GitHub
        # 基础设施内网）。版本号与校验和都固定值锁死（1.8.5，与
        # crates/arca-chunk/Cargo.toml 里 blake3 crate 的版本一致），
        # 不用 "latest"，避免上游发新版后 CI 静默换了一个没验证过的二进制。
        run: |
          curl -fsSL -o "$RUNNER_TEMP/b3sum" \
            https://github.com/BLAKE3-team/BLAKE3/releases/download/1.8.5/b3sum_linux_x64_bin
          echo "f50bce4fc682c2eba7e417fdc271c3e7ea6e9511568213878dbf2c115facf6f4  $RUNNER_TEMP/b3sum" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/b3sum"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: 造夹具并恢复
        run: |
          chmod +x crates/arca-conformance/tests/escape-hatch/*.sh
          crates/arca-conformance/tests/escape-hatch/make-fixture.sh "$RUNNER_TEMP/arca-fixture"
          crates/arca-conformance/tests/escape-hatch/recover.sh "$RUNNER_TEMP/arca-fixture" "$RUNNER_TEMP/arca-recovered"
      - name: 断言篡改会被检出
        # 一个永远成功的校验脚本比没有更糟：篡改夹具本体（不是 dest——
        # recover.sh 每次都会用 cp -R 整体重新覆盖 dest，篡改 dest 会被
        # 下一次恢复悄悄冲掉，测不出问题）后 recover.sh 必须以非零退出。
        run: |
          printf 'tampered' > "$RUNNER_TEMP/arca-fixture/files/note.txt"
          if crates/arca-conformance/tests/escape-hatch/recover.sh "$RUNNER_TEMP/arca-fixture" "$RUNNER_TEMP/arca-recovered2"; then
            echo "篡改未被检出——逃生舱校验失效" >&2
            exit 1
          fi
      - name: 断言只有空_files_目录会被拒绝而不是当成空库
        # 评审 Important #1：此前脚本唯一的结构性检查是 `test -d files`、唯一的
        # 覆盖度检查是 found_items != total_files——当 files/ 存在但为空、
        # .arca/items/ 也为空或缺失时，两个计数都是 0，脚本会打印
        # 「恢复并校验 0 个文件，0 个问题」并以退出码 0 收场，把「未挂载/身份
        # 不明的卷」误判成「本来就是空库」（违反 I11）。现在 recover.sh 在开头
        # 先校验 .arca/format.json 的存在与合法 dataset_id，这个场景必须以
        # 非零退出，且不能被误判为"没有文件可查所以自然零问题"。
        run: |
          mkdir -p "$RUNNER_TEMP/arca-empty-root/files"
          if crates/arca-conformance/tests/escape-hatch/recover.sh "$RUNNER_TEMP/arca-empty-root" "$RUNNER_TEMP/arca-recovered3"; then
            echo "只有空 files/ 目录（无 .arca/ 元数据）未被拒绝——I11 校验失效" >&2
            exit 1
          fi

  unplug-drills:
    name: 拔盘演练（I11，M2d）
    runs-on: ubuntu-latest
    # I11「挂载缺失即离线」与 I1 同级别的头号承诺，同样每次 push/PR 都跑，
    # 不等每晚 cron——见 crates/arca-conformance/tests/drills/README.md。
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 编译 arca / arcad 二进制
        run: cargo build -p arca-cli -p arcad --bins
      - name: chmod
        run: chmod +x crates/arca-conformance/tests/drills/*.sh
      - name: 正面 + 反面：客户端侧（status/sync/verify）
        run: crates/arca-conformance/tests/drills/unplug-cli.sh "$RUNNER_TEMP/unplug-cli"
      - name: 正面 + 反面：arcad 侧（某数据集 503，其余照常 200）
        run: crates/arca-conformance/tests/drills/unplug-arcad.sh "$RUNNER_TEMP/unplug-arcad"
      - name: 断言「演练脚本自己也会被假绿骗过」这件事不成立
        # 只跑正例的演练是假绿（M0 逃生舱脚本被评审抓到过三次"该失败时报
        # 成功"）——用一个把 status/sync/verify 强制改成"无论真实结果如何
        # 都报成功"的包装二进制重跑一遍 unplug-cli.sh，这次运行必须以非零
        # 退出；如果反而报告"全部通过"，说明 unplug-cli.sh 自己的断言逻辑
        # 失效了，不能再信任它能抓住真实回归。
        run: |
          if REAL_ARCA_BIN="$(pwd)/target/debug/arca" \
             ARCA_BIN="$(pwd)/crates/arca-conformance/tests/drills/fake-always-success-wrapper.sh" \
             crates/arca-conformance/tests/drills/unplug-cli.sh "$RUNNER_TEMP/unplug-cli-fake"; then
            echo "假绿的 arca 包装脚本没有被 unplug-cli.sh 抓出来——演练脚本本身的断言逻辑失效" >&2
            exit 1
          fi

  fuzz:
    name: fuzz 回归（含 ASAN，每晚）／${{ matrix.target }}
    runs-on: ubuntu-latest
    # 每晚而非每次 PR：60 秒 × 11 个 target 即使并行也不该占用日常 PR 反馈
    # 时间；但必须真的跑起来，否则「fuzz 覆盖了 I5」就只是写在报告里的话。
    # ubuntu-latest 上 ASAN 工作正常（本机 macOS + Apple Silicon 的 ASAN
    # 启动即挂起是本机环境问题，见 task-11-report.md），这里不传
    # --sanitizer none，用 cargo-fuzz 默认的 ASAN——decompress 背后
    # zstd-sys 的 FFI/C 库边界只有 ASAN 能覆盖，纯 `let _ =` 的 target
    # 本身不做正确性断言，靠的就是 ASAN 抓内存破坏。
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        target:
          - manifest
          - items
          - journal
          - cursor
          - index
          - format_json
          - dataset
          - registry
          - path_rules
          - trace
          - decompress
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-04
      - run: cargo install cargo-fuzz
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60
