[package]
name = "arca-agentd"
description = "可选客户端 daemon：自动同步 watcher · 占位符投影供给（手动模式不依赖它）"
license = "MIT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true

[dependencies]
arca-core = { path = "../arca-core" }
arca-format = { path = "../arca-format" }
arca-chunk = { path = "../arca-chunk" }
arca-store = { path = "../arca-store" }
# agentd 是 arca-cli 的**消费者**，不是它的平行实现：调和的决策来自
# arca-core、执行来自 arca_cli::sync，本 crate 只负责「什么时候调它」与
# 「失败了怎么退避」。两者同为 MIT，依赖方向合法。见 main.rs 模块文档。
arca-cli = { path = "../arca-cli" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
fs4 = "1.1.0"
notify = "8.2.0"
# 计划依赖（实现时启用）：rusqlite（投影，M3c）, notify（watcher，M3b）

[dev-dependencies]
tempfile = "3.27.0"
