[package]
name = "arca-format"
description = "arca 磁盘格式的纯数据结构 + 解析/序列化 + golden vectors（FORMAT.md 的落地）"
license = "MIT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true

[dependencies]
arca-chunk = { version = "0.0.1", path = "../arca-chunk" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8"

[dev-dependencies]
proptest = "1.8.0"
# 纪律（spec §11.3）：零重依赖、可嵌入；损坏输入 → 明确错误，绝不 panic（fuzz 覆盖）
