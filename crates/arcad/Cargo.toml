[package]
name = "arcad"
description = "arca 服务端 daemon —— 全系统唯一常驻进程（NAS / 服务器，单二进制）"
# 全仓唯一的 AGPL crate（spec §12.2）：其余 crate 为 MIT，可被此处使用；
# 反向不成立——两端共用的逻辑必须留在 arca-core / arca-format，不得下沉到这里。
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true

[dependencies]
arca-core = { path = "../arca-core" }
arca-format = { path = "../arca-format" }
arca-chunk = { path = "../arca-chunk" }
arca-store = { path = "../arca-store" }
# arcad 是 AGPL，arca-cli 是 MIT——依赖方向合法（MIT 库可进 arcad）。
# 复用 arca-cli 的 hub/journal/trash/transport（`LocalTransport`）原语，
# 不在 arcad 里重新实现一遍 CAS 落盘细节（M2b Task 5 brief 明文要求「复用」）。
arca-cli = { path = "../arca-cli" }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
# 只用 `StreamExt::next` 驱动请求体的流式读取（M2b 切片评审 C2：PUT 不再
# 把整份请求体先缓冲进内存）——axum 自身已经传递依赖 futures-util，这里
# 固定同一版本，不引入新的依赖树分支。
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
base64 = "0.23.1"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
