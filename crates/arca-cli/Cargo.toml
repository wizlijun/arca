[package]
name = "arca-cli"
description = "arca 命令行（独立 `arca …` 与子命令 `git arca …` 双形态）"
license = "MIT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true

[[bin]]
name = "arca"
path = "src/main.rs"

[dependencies]
arca-core = { path = "../arca-core" }
arca-format = { path = "../arca-format" }
arca-chunk = { path = "../arca-chunk" }
arca-git = { path = "../arca-git" }
arca-publish = { path = "../arca-publish" }
clap = { version = "4.6.5", features = ["derive"] }
arca-store = { path = "../arca-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
directories = "6.0.0"

[dev-dependencies]
tempfile = "3.27.0"
# 计划依赖（实现时启用）：serde_json（--json 输出，M1）
